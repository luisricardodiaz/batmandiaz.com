<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Shadow -->
    <filter id="cdShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Base Disc Metallic Gradient -->
    <radialGradient id="discMetal" cx="50%" cy="50%" r="50%" fx="45%" fy="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e8ecf1"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Iridescent Rainbow Light Refraction -->
    <conicGradient id="rainbowSheen" cx="50%" cy="50%">
      <stop offset="0deg" stop-color="rgba(255, 0, 128, 0.35)"/>
      <stop offset="45deg" stop-color="rgba(255, 165, 0, 0.4)"/>
      <stop offset="90deg" stop-color="rgba(255, 255, 0, 0.35)"/>
      <stop offset="135deg" stop-color="rgba(0, 255, 128, 0.4)"/>
      <stop offset="180deg" stop-color="rgba(0, 191, 255, 0.45)"/>
      <stop offset="225deg" stop-color="rgba(138, 43, 226, 0.4)"/>
      <stop offset="270deg" stop-color="rgba(255, 0, 128, 0.35)"/>
      <stop offset="315deg" stop-color="rgba(0, 255, 255, 0.4)"/>
      <stop offset="360deg" stop-color="rgba(255, 0, 128, 0.35)"/>
    </conicGradient>

    <!-- Subtle Angular Specular Highlights -->
    <linearGradient id="specular1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.2)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </linearGradient>

    <!-- Inner Plastic Hub Ring Gradient -->
    <radialGradient id="innerHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#94a3b8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Track Lines Pattern -->
    <pattern id="cdGrooves" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    </pattern>

    <!-- Background Square subtle framing -->
    <linearGradient id="caseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d24"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>

  <!-- Background Case Area -->
  <rect width="500" height="500" rx="16" fill="url(#caseBg)"/>

  <!-- Main CD Disc Group with Shadow -->
  <g filter="url(#cdShadow)">
    <!-- Outer Disc Edge Rim -->
    <circle cx="250" cy="250" r="215" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Data Surface Metallic Base -->
    <circle cx="250" cy="250" r="213" fill="url(#discMetal)"/>

    <!-- Diffraction Color Cones -->
    <!-- Cone 1 (Top Left to Bottom Right) -->
    <path d="M 250 250 L 100 90 A 213 213 0 0 1 180 45 Z" fill="rgba(255, 0, 100, 0.35)" style="mix-blend-mode: overlay;"/>
    <path d="M 250 250 L 180 45 A 213 213 0 0 1 270 38 Z" fill="rgba(255, 180, 0, 0.4)" style="mix-blend-mode: overlay;"/>
    <path d="M 250 250 L 270 38 A 213 213 0 0 1 355 75 Z" fill="rgba(0, 230, 150, 0.35)" style="mix-blend-mode: overlay;"/>

    <!-- Cone 2 (Opposite side) -->
    <path d="M 250 250 L 400 410 A 213 213 0 0 1 320 455 Z" fill="rgba(255, 0, 100, 0.35)" style="mix-blend-mode: overlay;"/>
    <path d="M 250 250 L 320 455 A 213 213 0 0 1 230 462 Z" fill="rgba(0, 180, 255, 0.4)" style="mix-blend-mode: overlay;"/>
    <path d="M 250 250 L 230 462 A 213 213 0 0 1 145 425 Z" fill="rgba(180, 0, 255, 0.35)" style="mix-blend-mode: overlay;"/>

    <!-- Disc Grooves Overlay -->
    <circle cx="250" cy="250" r="213" fill="url(#specular1)" style="mix-blend-mode: soft-light;"/>

    <!-- Subtle Data Track Rings -->
    <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="185" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="150" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="130" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="110" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="0.75"/>
    <circle cx="250" cy="250" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Mirror Lead-in Area -->
    <circle cx="250" cy="250" r="90" fill="#94a3b8" opacity="0.6"/>
    <circle cx="250" cy="250" r="88" fill="#e2e8f0" opacity="0.8"/>

    <!-- Clear Plastic Inner Stacking Ring Area -->
    <circle cx="250" cy="250" r="75" fill="url(#innerHub)" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="62" fill="#1e293b" opacity="0.85"/>
    <circle cx="250" cy="250" r="58" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 3"/>

    <!-- Inner Transparent Plastic Clamping Ring -->
    <circle cx="250" cy="250" r="45" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="36" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- Center Spindle Hole -->
    <circle cx="250" cy="250" r="28" fill="#0a0c10" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Compact Disc Logo Stamp (Top right subtly engraved) -->
  <g transform="translate(295, 120) scale(0.65)" opacity="0.45">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#334155" letter-spacing="2">COMPACT</text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#334155" letter-spacing="1">DISC</text>
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.5">DIGITAL AUDIO</text>
  </g>

  <!-- Specular Reflection Highlight Slash -->
  <path d="M 120 40 L 60 100 L 380 460 L 440 400 Z" fill="url(#specular1)" opacity="0.12" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>
